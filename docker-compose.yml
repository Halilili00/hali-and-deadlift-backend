services:
  db:
    image: postgres:15-alpine
    container_name: hali_deadlift_db
    restart: always
    environment:
      POSTGRES_USER: hali_deadlift_user
      POSTGRES_PASSWORD: hali_deadlift_password
      POSTGRES_DB: hali_deadlift_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: hali_deadlift_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:
